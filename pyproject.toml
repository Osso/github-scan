[project]
name = "github-scan"
version = "0.1.0"
description = "Scan GitHub issue, PR, and repository code content before releasing it to an agent"
requires-python = ">=3.11,<3.15"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
github-scan = "github_scan.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
